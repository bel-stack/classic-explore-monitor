name: Check Google Trends Classic Explore

on:
  workflow_dispatch:
  schedule:
    # 9:17 AM and 5:17 PM New York time (automatically handles EST/EDT).
    - cron: '17 9,17 * * *'
      timezone: 'America/New_York'

permissions:
  contents: read
  issues: write

concurrency:
  group: classic-explore-monitor
  cancel-in-progress: false

jobs:
  check-classic-explore:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Install browser checker
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Check the exact legacy page
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          // Do not call this constant URL: that would shadow Node's global URL
          // constructor while Playwright is loading.
          const TARGET_URL = 'https://trends.google.com/trends/explore?q=coconut&date=now%201-d&geo=PH&legacy&hl=en';
          const pause = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          async function inspect(browser, visitNumber) {
            const context = await browser.newContext({
              viewport: {width: 1365, height: 900},
              locale: 'en-US',
              timezoneId: 'America/New_York',
            });
            const page = await context.newPage();
            const apiResults = [];
            const onResponse = (res) => {
              if (res.url().includes('/trends/api/widgetdata/multiline')) {
                apiResults.push(res.status());
              }
            };
            page.on('response', onResponse);
            let responseCode = null;
            let navigationError = '';
            try {
              const response = await page.goto(TARGET_URL, {
                waitUntil: 'domcontentloaded', timeout: 45000
              });
              responseCode = response?.status() ?? null;
              await pause(4000);

              // Google sometimes asks users whether to continue to Classic.
              const continueButton = page.getByRole('button', {name: /Go to Classic Explore/i});
              if (await continueButton.count()) {
                await continueButton.first().click({timeout: 7000}).catch(() => {});
              } else {
                const continueText = page.getByText('Go to Classic Explore', {exact: true});
                if (await continueText.count()) {
                  await continueText.first().click({timeout: 7000}).catch(() => {});
                }
              }
              await page.locator('trends-widget').first().waitFor({state: 'attached', timeout: 23000}).catch(() => {});
              await pause(5000);
            } catch (err) {
              navigationError = String(err?.message || err);
            }
            page.off('response', onResponse);

            let body = '';
            try { body = (await page.locator('body').innerText({timeout:5000})).slice(0, 30000); }
            catch (err) { navigationError += ' | Could not read page body'; }
            const legacyWidgets = await page.locator('trends-widget').count().catch(() => 0);
            const oldChart = page.locator('trends-widget').filter({hasText: /Interest over time/i});
            const renderedCharts = await oldChart.locator('svg, canvas').count().catch(() => 0);
            const hasChartText = /Interest over time/i.test(body);
            const timelineSuccess = apiResults.some(code => code === 200);
            const currentUrl = page.url();
            const redirectedToNewExplore = /^https:\/\/trends\.google\.com\/explore(?:[/?#]|$)/i.test(currentUrl);
            const newExploreEvidence = /Suggest search terms|Get suggestions with Gemini|Ask Gemini/i.test(body);
            const classicExpiryNotice = /Classic Explore is expiring soon/i.test(body);
            const rateLimited = responseCode === 429 || responseCode === 403 ||
              /too many requests|unusual traffic|not a robot|captcha/i.test(body);

            let status = 'INCONCLUSIVE';
            if (legacyWidgets > 0 && hasChartText && (renderedCharts > 0 || timelineSuccess)) {
              status = 'AVAILABLE';
            } else if (!rateLimited && (newExploreEvidence || redirectedToNewExplore) &&
                       legacyWidgets === 0 && responseCode === 200) {
              status = 'LIKELY_RETIRED';
            }
            const result = {
              attempt: visitNumber, status, responseCode, currentUrl,
              legacyWidgets, renderedCharts, hasChartText, apiResults,
              newExploreEvidence, redirectedToNewExplore, classicExpiryNotice,
              rateLimited, navigationError,
            };
            await page.screenshot({path: `classic-attempt-${visitNumber}.png`, fullPage: true}).catch(() => {});
            await context.close().catch(() => {});
            return result;
          }

          (async () => {
            let browser;
            let status = 'INCONCLUSIVE';
            const attempts = [];
            try {
              browser = await chromium.launch({headless: true});
              attempts.push(await inspect(browser, 1));
              // Retry any unsuccessful check. Rate limits get a longer pause,
              // and the retry uses a fresh browser context.
              if (attempts[0].status !== 'AVAILABLE') {
                await pause(attempts[0].rateLimited ? 60000 : 15000);
                attempts.push(await inspect(browser, 2));
              }
              if (attempts.some(x => x.status === 'AVAILABLE')) status = 'AVAILABLE';
              else if (attempts.length === 2 && attempts.every(x => x.status === 'LIKELY_RETIRED')) {
                status = 'LIKELY_RETIRED';
              }
            } catch (error) {
              attempts.push({error: String(error)});
            } finally {
              if (browser) await browser.close().catch(() => {});
              fs.writeFileSync('classic-status.txt', status + '\n');
              fs.writeFileSync('classic-result.json', JSON.stringify({
                checkedAt: new Date().toISOString(), url: TARGET_URL, status, attempts
              }, null, 2));
              console.log(JSON.stringify({status, attempts}, null, 2));
              if (status === 'INCONCLUSIVE') {
                console.log('::warning::Google blocked or changed the page, or the chart did not load. This is NOT proof of retirement.');
              }
            }
          })();
          NODE

      - name: Save screenshots and check details
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classic-explore-check
          path: |
            classic-attempt-*.png
            classic-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Create an alert if Classic appears retired
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          STATUS="$(cat classic-status.txt)"
          TITLE="Google Trends Classic Explore may have been retired"
          CHECKED_AT="$(jq -r '.checkedAt' classic-result.json)"
          EXISTING="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
          if [ "$STATUS" = "LIKELY_RETIRED" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create \
                --title "$TITLE" \
                --assignee "$REPOSITORY_OWNER" \
                --body "Checked at: $CHECKED_AT (UTC)\n\nThe exact coconut/Philippines legacy URL showed the new Explore UI twice in separate browser sessions without loading Classic Explore. **Please confirm manually:** https://trends.google.com/trends/explore?q=coconut&date=now%201-d&geo=PH&legacy&hl=en\n\nThis is a **suspected retirement**, not a confirmed Google announcement. Check the latest workflow run's 'classic-explore-check' screenshot artifact. False positives can occur if Google serves different experiences to GitHub's browser."
            else
              echo "Existing alert issue #$EXISTING is already open."
            fi
          elif [ "$STATUS" = "AVAILABLE" ] && [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "The latest automated check saw Classic Explore's chart again, so closing this warning."
            gh issue close "$EXISTING"
          else
            echo "Status: $STATUS. No new alert."
          fi
